name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: node --check skills/vmware/scripts/vmware.js && node --check skills/vmware/scripts/selftest.js
      - name: Self-test (no VM required)
        run: node skills/vmware/scripts/selftest.js
      - name: Smoke test
        run: node skills/vmware/scripts/vmware.js help
      - name: Validate manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json'))"
      - name: Validate skill frontmatter
        run: |
          node -e "
            const fs = require('fs');
            const t = fs.readFileSync('skills/vmware/SKILL.md', 'utf8');
            const m = t.match(/^---\n([\s\S]*?)\n---/);
            if (!m) throw new Error('missing YAML frontmatter');
            for (const k of ['name:', 'description:']) {
              if (!m[1].includes(k)) throw new Error('frontmatter missing ' + k);
            }
          "
